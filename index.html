<!DOCTYPE html>
<html>
    <head>
        <title>The Oranges Wigan</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.png" sizes="32x32">
        <style>
          /* Style the navigation bar */
          .navbar {
            overflow: hidden;
            background-image: linear-gradient(120deg, #ff8c00, #ffffff);
          }
          
          /* Navigation links */
          .navbar a {
            float: left;
            display: block;
            color: #333;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
          }
          
          /* Change the link color on hover */
          .navbar a:hover {
            background-color: #ddd;
            color: #333;
          }
          </style>
    </head>

    <body>
      <div class="navbar">
        <a href="#home">Home</a>
        <a href="#news">News</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>
      </div>
      
    </body>

</html>
